# Spell catalogue — the design's half of the source of truth.
#
# WORDS ONLY. Every number a spell has (cooldown, cast time, damage, tiers,
# grants, projectile, behaviours) is read out of the game's `.tres` files by
# design/tools/extract.py — never restate one here.
#
# Only SHIPPED spells belong in this file: a spell is here iff
# game/characters/player/spells/<id>/ ships tier `.tres` files. Proposals live
# in the hand-written "ideas" section of design/docs/spells.md, out of the
# generated region; graveyard content lives nowhere but graveyard/.
#
# Edit here, then run:  python3 design/tools/build.py
#
# Per spell:
#   id          : the spell's FOLDER NAME under characters/player/spells/ — the
#                 join key to the game. `--check` fails if it resolves to nothing.
#   name        : display name (proper casing the id can't give: ChargeDash)
#   category    : one of `categories` below, whose order is the doc's section order
#   description : the design intent, in prose
#   per_tier    : optional — what a tier upgrade buys, which no .tres states

categories:
  - id: dps
    name: DPS
    description: >
      The primary-damage core: hold-to-fire spells that loose a burst then cool down, the player's
      mirror of an enemy attack.
  - id: nukes
    name: Nukes
    description: >
      Long cooldown, big single payload.
  - id: summon
    name: Summon
    description: >
      Minions you cast into the fight — they run their own AI and keep working while you move and
      cast other things.
  - id: utility
    name: Utility
    description: >
      Everything that isn't raw damage or a summon: mobility, buffs, crowd control, denial, and
      mitigation. Some are instant and layer on top of your damage; others are channeled or charged
      holds that trade a slot of offence to shape or survive the fight.
spells:
  - id: pew
    name: Pew
    category: dps
    description: >
      One burst of single bullets at the cursor, then cooldown, rather than a sustained hose. The
      burst is short enough to read as a single commitment: you aim and fire, then move on. It is
      the reliable all-rounder, the spell every other weapon is measured against.
  - id: snipe
    name: Snipe
    category: dps
    description: >
      A few homing bullets toward the first enemy in the cursor direction. They all launch on the
      same frame rather than staggering, so the volley lands as one clustered hit instead of a trickle:
      a target either eats the whole thing or none of it. Accurate, but low DPS for the cooldown.
      Use it to pick off a specific enemy, not to clear a room.
  - id: blam
    name: Blam
    category: dps
    description: >
      Two shotgun blasts back-to-back at the cursor, then cooldown: a double barrel, capped at two
      rather than a sustained run. Both barrels are the whole spell, so a miss on either half is
      a real cost. It is a close-range shredder: at point blank the two cones overlap almost entirely
      and the whole pellet count lands on one body.
  - id: ring
    name: Ring
    category: dps
    description: >
      A few fast rings of bullets pulsed out of the caster. Every pulse spawns at the caster's exact
      centre and expands outward, and each one is rotated off the last, so the gaps between bullets
      in one ring are covered by the next. There is no aim: the spell is pure area denial around
      your own body. Walk into a crowd and let the pulses do the sorting.
    per_tier: damage, bullet count, pulses
  - id: fireball
    name: Fireball
    category: nukes
    description: >
      The starting spell: the first thing a new player has in a slot, and the baseline every other
      nuke is read against. A homing orb toward the enemy nearest the cursor; it explodes on impact,
      wall, or max range. All damage is the explosion, so a shot that expires in open air still
      deals it. The homing and the guaranteed detonation make it hard to waste, which is what a
      first spell should be.
    per_tier: damage, explosion radius
  - id: zaap
    name: Zaap
    category: nukes
    description: >
      An instant chain-lightning bolt that leaps between packed enemies; one lone target gets a
      single zap.
  - id: zoing
    name: Zoing
    category: nukes
    description: >
      A fast piercing bullet that ricochets off walls; each bounce is a fresh leg of travel and
      adds damage.
  - id: bwoom
    name: Bwoom
    category: nukes
    description: >
      Charges in front of the caster while held, growing per tick; on release it fires a piercing
      line whose damage scales with charge.
  - id: halp
    name: Halp
    category: summon
    description: >
      A small squad of ranged minions firing single bullets. A walking gunline.
  - id: bzzz
    name: Bzzz
    category: summon
    description: >
      A fragile swarm of fast, short-range minions; chaff that dumps damage then dies.
  - id: jimmy
    name: Jimmy
    category: summon
    description: >
      One heavy minion firing a ring around itself; a walking turret that denies an area.
  - id: charge_dash
    name: ChargeDash
    category: utility
    description: >
      Charges in a direction for a short duration at high speed. Sends bullets at 90 degrees.
  - id: thwomp
    name: Thwomp
    category: utility
    description: >
      An instant radial knockback pulse; more damage the closer the enemy, chip at the edge. The
      "get off me" button.
  - id: blink
    name: Blink
    category: utility
    description: >
      An instant hop along your aim: you vanish and reappear a fixed distance away, leaving a
      ghost behind. Aim is a direction rather than a click, so the hop is a length you learn
      instead of a spot you pick, and it refuses a landing with a wall in the way rather than
      posting you through one. Pure mobility — no damage, no wind-up, just the gap between
      where a boss's charge is going and where you are.
    per_tier: a longer hop on a shorter cooldown.
  - id: oop
    name: Oop
    category: utility
    description: >
      Drops a mine a tile ahead of your aim — in the doorway, not under your feet. It arms on
      a short delay and then goes up in a fireball-sized blast the moment an enemy touches it. The mine is a dumb object — it has
      no health, nothing can shoot it, and it never moves or chases; it is a hazard the room
      has to walk around. Several can be out at once, so it plays as prep: seed the doorway
      you are about to retreat through, or the lane the pack has to cross. The cinderstone is the
      same detonation pointed the other way.
  - id: ploop
    name: Ploop
    category: utility
    description: >
      The mine that answers a crowd instead of a target: same drop, same arming, but on contact
      it erupts into a full ring of piercing darts that run through everything in line. Lower
      per-hit than Oop's blast, far better across a corridor or into a pack, and the darts keep
      going after the first body.
  - id: nope
    name: Nope
    category: utility
    description: >
      On a long cooldown, raises a bubble that absorbs incoming damage and pays a slice of it
      back as health; a white ring flashes on each absorbed hit.
  - id: heal
    name: Heal
    category: utility
    description: >
      Instantly restores health. The safety net every survivability loadout considers.
