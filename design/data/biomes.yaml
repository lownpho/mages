# Biome catalogue — the design's half of the source of truth.
#
# WORDS ONLY. Room types, their difficulty tier, their generator and their whole
# enemy spawn table are read out of game/world_content/**.tres by
# design/tools/extract.py, as is the starter kit (world.gd's STARTER_SPELLS).
# The room tables here used to be hand-written and had already drifted from the
# game; they are generated now, and an empty spawn table renders as empty.
#
# Two levels, both keyed on the game:
#   families : the doc PAGE — one section per BiomeDef.family (biomes with no
#              family form their own). Purely presentational grouping.
#   biomes   : one entry per BiomeDef, keyed on its `id` — the join key.
#
# Only SHIPPED biomes belong here. Proposals stay in the hand-written "ideas"
# section of design/docs/biomes.md.
#
# Edit here, then run:  python3 design/tools/build.py
#
# planned_roster is the ONE authored thing that may disagree with the game: for a
# biome whose tables are still empty it is the intent, rendered as "planned, not
# spawning yet". Where the game spawns anything, that IS the roster — don't
# author one.

families:
  - id: glade
    name: Glade
    tier_label: T1/T2
    intro: >
      The opening biome, where the player learns the systems and fills out a first kit. Enemy density
      is low, variety is high, stakes are gentle. It has two sub-biomes: the starting glade, which
      is pure onboarding, and the veggie glade, which brings in the plant roster and its boss.
    enemies_intro: >
      The opening biome. It comes in two flavours: the floral **starting glade**, capped by the
      **fae**, and the rooted **veggie glade**, capped by the **thornmess**.
  - id: deepwood
    name: Deepwood
    tier_label: T3
    intro: >
      The second biome, tuned to pressure long-range, squishy builds and push the player into close
      quarters. Enemies have far more health and hit harder. The biome itself is carved and reachable
      — both glades gate into it — and its animal roster is built, but the room spawn tables are
      still empty, so nothing in it spawns yet. The three remaining sub-biomes (mimic, insect, fungal)
      are proposals; they stay in the ideas section below.
    enemies_intro: >
      The forest, T3. A shared pool of eleven natives is meant to appear in every deepwood sub-biome;
      on top of it the **animal deepwood** adds its own beasts and the **gnarlking**. All of these
      are built and tuned; none of them spawn yet.
biomes:
  - id: glade_start
    name: Starting glade
    intro: >
      Onboarding: single-enemy rooms first, small mixed groups by T2, then the biome's rare and
      boss at T3.
  - id: glade_veggie
    name: Veggie glade
    intro: >
      Brings in the plant roster: thornthrower and rosebud both show up from T1. Groups get denser
      and harder than the starting glade by T2. T3 keeps the shared rare pair (1x viper, 1x mandraker)
      and the biome boss.
  - id: deepwood
    name: Deepwood
    intro: >
      One biome in-game, not yet split into the four sub-biomes the design plans. Seven room types
      are shipped and placed; every one of them carries an empty spawn table, so the roster below
      is reachable only through the debug console.
    planned_roster: [moth, moon_moth, needle_moth, stalker, snake, coral_snake, ash_snake, grimling,
      shard_grimling, wisp_grimling, moss_golem, thornback, owl, mole, grimlord, razorback, great_owl,
      gnarlking]
