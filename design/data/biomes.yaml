# Biome catalogue — the design's half of the source of truth.
#
# WORDS ONLY. Which enemies a Biome places (its roster and Fixed encounters, its
# Zones' included) is read out of game/generation/world/biomes/<id>/ by
# design/tools/extract.py, as is the starter pool (world.gd's STARTER_POOL).
#
# One entry per documented Biome, keyed on its folder name — the join key. Its
# zones are optional prose, each keyed on a Zone file name in that Biome's zones/.
# A Biome placing enemies nothing else documents must be listed, or those enemies
# drop out of enemies.md and the build fails.
#
# Proposals stay in the hand-written "ideas" section of design/docs/biomes.md.
#
# Edit here, then run:  python3 design/tools/build.py

biomes:
  - id: glade
    name: Glade
    tier_label: T1/T2
    intro: >
      The opening biome, where the player learns the systems and fills out a first kit. Enemy density
      is low, variety is high, stakes are gentle. The starting glade is pure onboarding, and the
      veggie glade brings in the plant roster and its Miniboss.
    enemies_intro: >
      The opening biome. It comes in two flavours: the floral **starting glade**, capped by the
      **fae**, and the rooted **veggie glade**, capped by the **thornmess**.
    zones:
      - id: start
        name: Starting glade
        intro: >
          Onboarding, and the Spawn zone: the first roster enemies are taught one at a time before
          anything mixes.
      - id: veggie
        name: Veggie glade
        intro: >
          Brings in the plant roster: thornthrower and rosebud join the Glade's own, and the
          thornmess waits as the Zone's Miniboss.
  - id: deepwood
    name: Deepwood
    tier_label: T3
    intro: >
      The second biome, tuned to pressure long-range, squishy builds and push the player into close
      quarters. Enemies have far more health and hit harder. It has two Zones: the animal deepwood,
      and the small mimic pocket. The insect one is still a proposal and stays in the ideas section
      below; the fungal one left the deepwood entirely and became the Mycelium, a Side biome of its
      own.
    enemies_intro: >
      The forest, T3. Eleven natives make up the shared pool meant to appear in every deepwood
      Zone; on top of it the **animal deepwood** adds its own beasts and the **gnarlking**,
      and the **mimic deepwood** its props with eyes. The whole roster spawns, introduced one
      mechanic at a time.
    zones:
      - id: main
        name: Animal deepwood
        intro: >
          The bulk of the forest. Each of the eight mechanics is taught alone before its enemies mix,
          the six family variations come later, and the three rares and the gnarlking sit on top.
          The variations are deliberately kept apart, so seeing all three moths or all three snakes
          means going looking for them.
      - id: mimic
        name: Mimic deepwood
        intro: >
          A small pocket of props with eyes: the bush that reveals, the harasser that blinks, then
          the two logs that are bombs, each taught on its own before it mixes with the shared pool,
          so the mine is never the only thing asking for your attention. Its three rares each escort
          the common they are a variant of.
  - id: mycelium
    name: Mycelium
    tier_label: T3
    intro: >
      The fungal Side biome hanging off the deepwood, in three Zones: clusters, hollows and
      sporefields. Spore clouds are the floor both sides fight over.
    enemies_intro: >
      Fifteen bodies, all built, all fungal: five rooted turrets, three splitters, three movers,
      a rot heavy and three rares. Half of them print spore clouds and the other half fight
      harder while standing in them. All of it spawns, spread over the Mycelium's three Zones.
