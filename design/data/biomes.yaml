# Biome catalogue — the design's half of the source of truth.
#
# WORDS ONLY. Room types, their difficulty tier, their generator and their whole
# enemy spawn table are read out of game/world_content/**.tres by
# design/tools/extract.py, as is the starter kit (world.gd's STARTER_SPELLS).
# The room tables here used to be hand-written and had already drifted from the
# game; they are generated now, and an empty spawn table renders as empty.
#
# Two levels, both keyed on the game:
#   families : the doc PAGE — one section per BiomeDef.family (biomes with no
#              family form their own). Purely presentational grouping.
#   biomes   : one entry per BiomeDef, keyed on its `id` — the join key.
#
# Only SHIPPED biomes belong here. Proposals stay in the hand-written "ideas"
# section of design/docs/biomes.md.
#
# Edit here, then run:  python3 design/tools/build.py
#
# planned_roster is the ONE authored thing that may disagree with the game: for a
# biome whose tables are still empty it is the intent, rendered as "planned, not
# spawning yet". Where the game spawns anything, that IS the roster — don't
# author one.

families:
  - id: glade
    name: Glade
    tier_label: T1/T2
    intro: >
      The opening biome, where the player learns the systems and fills out a first kit. Enemy density
      is low, variety is high, stakes are gentle. It has two sub-biomes: the starting glade, which
      is pure onboarding, and the veggie glade, which brings in the plant roster and its boss.
    enemies_intro: >
      The opening biome. It comes in two flavours: the floral **starting glade**, capped by the
      **fae**, and the rooted **veggie glade**, capped by the **thornmess**.
  - id: deepwood
    name: Deepwood
    tier_label: T3
    intro: >
      The second biome, tuned to pressure long-range, squishy builds and push the player into close
      quarters. Enemies have far more health and hit harder. It is the largest biome in the world —
      twice the footprint of either glade — and both glades gate into it. It has two sub-biomes:
      the animal deepwood, and the small mimic pocket hanging off its side. The two remaining ones
      (insect, fungal) are proposals; they stay in the ideas section below.
    enemies_intro: >
      The forest, T3. Eleven natives make up the shared pool meant to appear in every deepwood
      sub-biome; on top of it the **animal deepwood** adds its own beasts and the **gnarlking**,
      and the **mimic deepwood** its props with eyes. The whole roster spawns, and the rooms are
      built to introduce it one mechanic at a time.
biomes:
  - id: glade_start
    name: Starting glade
    intro: >
      Onboarding: single-enemy rooms first, small mixed groups by T2, then the biome's rare and
      boss at T3.
  - id: glade_veggie
    name: Veggie glade
    intro: >
      Brings in the plant roster: thornthrower and rosebud both show up from T1. Groups get denser
      and harder than the starting glade by T2. T3 keeps the shared rare pair (1x viper, 1x mandraker)
      and the biome boss.
  - id: deepwood
    name: Deepwood
    intro: >
      The animal sub-biome, and the bulk of the forest. The rooms run a
      teach-then-test ladder: T0 meets each of the eight mechanics alone in its own room, T1 pairs
      them off, T2 introduces the six family variations alone and re-tests the pairs, and T3 mixes
      three kinds at a time around the three rares and the gnarlking. Every enemy has a room of its
      own, so a run meets all eighteen — the variations are deliberately kept apart, so seeing all
      three moths or all three snakes means going looking for them.
  - id: deepwood_mimic
    name: Mimic deepwood
    intro: >
      A small pocket off the side of the animal deepwood, always bordering it. Props with eyes:
      each of the four commons gets its own room first — the bush that reveals, the harasser that
      blinks, then the two logs that are bombs — and the cave rooms after that pair one of them
      with something from the shared pool, so the mine is never the only thing asking for your
      attention. Its three rares each escort the common they are a variant of. There is no boss;
      the deepest room is the door down to the mushroom dungeon, which leads nowhere yet.
